```yaml
name: Build SVT-AV1 Windows x86-64

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      repo: ${{ steps.info.outputs.repo }}
      version: ${{ steps.info.outputs.version }}
      tag: ${{ steps.info.outputs.tag }}

    steps:
      - name: Determine repository and version
        id: info
        shell: bash
        env:
          GH_REPOSITORY: ${{ github.repository }}
          GH_REF: ${{ github.ref }}
        run: |
          echo "repo=https://github.com/Alliance-for-Open-Media/SVT-AV1.git" >> "$GITHUB_OUTPUT"
          echo "tag=${GH_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          echo "version=${GH_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

  build-windows-x86-64:
    needs: tag
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            tar
            xz
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Clone SVT-AV1
        shell: pwsh
        run: |
          git clone "${{ needs.tag.outputs.repo }}" --branch "${{ needs.tag.outputs.version }}" --single-branch .

      - name: Build SVT-AV1
        uses: Akatmks/build-svt-av1@v1
        with:
          ffms2: "true"
          cmakeflags: "-DUSE_WEBM_IO=ON -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded"

      - name: Package x86-64 build
        shell: msys2 {0}
        run: |
          set -e
          find BuildAction -name SvtAv1EncApp.exe
          mkdir -p release

          EXE="$(find BuildAction -path '*/x86-64-v3+znver2/static/ffms2/SvtAv1EncApp.exe' -print -quit)"

          if [ -z "$EXE" ]; then
            echo "Requested x86-64 build not found."
            exit 1
          fi

          tar cJf release/Windows_x86-64_SvtAv1EncApp.tar.xz -C "$(dirname "$EXE")" SvtAv1EncApp.exe

      - name: Upload build to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.tag.outputs.tag }}
          files: release/Windows_x86-64_SvtAv1EncApp.tar.xz
          fail_on_unmatched_files: true

### Important notes

- **Source repository:** The workflow uses the official Alliance for Open Media SVT-AV1 repository.
- **Release trigger:** Push a tag such as `v4.0.0` to trigger the workflow automatically. You can also run it manually using the Actions tab.
- **CPU compatibility:** The `x86-64-v3+znver2` build requires a compatible CPU. It is not suitable for every x86-64 processor.
- **SVT-AV1 PSY:** This workflow builds the source repository you specify. It does not automatically add SVT-AV1-PSY modifications.
- **Build dependencies:** The `Akatmks/build-svt-av1@v1` action controls the actual build process. Verify that its toolchain is compatible with the selected MSYS2 environment.

**One thing to consider:** If you want an executable that runs on most Windows 10/11 64-bit PCs, I recommend building a baseline x86-64 version rather than relying only on `x86-64-v3+znver2`.
